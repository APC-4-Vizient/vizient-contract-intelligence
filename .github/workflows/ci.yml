name: CI

# Builds and tests; it does not deploy. The steps are the ones `python scripts/check.py` runs on a workstation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-tools.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Check
        run: python scripts/check.py --python

  app:
    name: Code App on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: contract-review/package-lock.json
      - name: Install
        run: npm ci
        working-directory: contract-review
      - name: Check
        run: python scripts/check.py --app
